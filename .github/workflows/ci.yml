name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
        exclude:
          - os: windows-latest
            node-version: 24.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm ci

      - name: Run tests
        run: pnpm test

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Build project
        run: pnpm run build

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Create MCP bundle
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: |
          pnpm dlx @anthropic-ai/mcpb validate manifest.json
          pnpm dlx @anthropic-ai/mcpb pack . testrail-mcp-server.mcpb

      - name: Upload MCP bundle artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        with:
          name: mcp-bundle
          path: testrail-mcp-server.mcpb
          retention-days: 7
          if-no-files-found: error
